<svg xmlns="http://www.w3.org/2000/svg" width="760" height="393" viewBox="0 0 760 393" role="img">
  <style>
    .t { font: 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5B6772; }
    .lbl { font: 12px 'SF Mono', Consolas, monospace; fill: #5B6772; }
    .num { font: 12px 'SF Mono', Consolas, monospace; fill: #5B6772; }
    .hd { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2B3540; }
    .sub { font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5B6772; }
    @media (prefers-color-scheme: dark) {
      .t, .lbl, .num, .sub { fill: #98A6B2; }
      .hd { fill: #D6DEE6; }
    }
  </style>
  <text x="0" y="20" class="hd">How long a real order rests before it is removed</text>
  <text x="0" y="40" class="sub">NASDAQ, 2019-12-30. 1,999,716 sampled orders, add to removal.</text>
  <text x="112" y="76" class="lbl" text-anchor="end">&lt; 1 us</text>
  <rect x="122" y="62" width="1.0" height="20" fill="#C2703D" opacity="0.85" rx="1"/>
  <text x="131.0" y="76" class="num">0.0% (0% cum)</text>
  <text x="112" y="103" class="lbl" text-anchor="end">1-10 us</text>
  <rect x="122" y="89" width="1.0" height="20" fill="#C2703D" opacity="0.85" rx="1"/>
  <text x="131.0" y="103" class="num">0.0% (0% cum)</text>
  <text x="112" y="130" class="lbl" text-anchor="end">10-100 us</text>
  <rect x="122" y="116" width="102.6" height="20" fill="#C2703D" opacity="0.85" rx="1"/>
  <text x="232.6" y="130" class="num">6.7% (7% cum)</text>
  <text x="112" y="157" class="lbl" text-anchor="end">100 us - 1 ms</text>
  <rect x="122" y="143" width="76.9" height="20" fill="#C2703D" opacity="0.85" rx="1"/>
  <text x="206.9" y="157" class="num">5.0% (12% cum)</text>
  <text x="112" y="184" class="lbl" text-anchor="end">1-10 ms</text>
  <rect x="122" y="170" width="112.2" height="20" fill="#C2703D" opacity="0.85" rx="1"/>
  <text x="242.2" y="184" class="num">7.3% (19% cum)</text>
  <text x="112" y="211" class="lbl" text-anchor="end">10-100 ms</text>
  <rect x="122" y="197" width="151.5" height="20" fill="#2E8B7A" opacity="0.85" rx="1"/>
  <text x="281.5" y="211" class="num">9.9% (29% cum)</text>
  <text x="112" y="238" class="lbl" text-anchor="end">100 ms - 1 s</text>
  <rect x="122" y="224" width="278.2" height="20" fill="#2E8B7A" opacity="0.85" rx="1"/>
  <text x="408.2" y="238" class="num">18.2% (47% cum)</text>
  <text x="112" y="265" class="lbl" text-anchor="end">1-10 s</text>
  <rect x="122" y="251" width="470.0" height="20" fill="#2E8B7A" opacity="0.85" rx="1"/>
  <text x="600.0" y="265" class="num">30.7% (78% cum)</text>
  <text x="112" y="292" class="lbl" text-anchor="end">10-60 s</text>
  <rect x="122" y="278" width="215.0" height="20" fill="#2E8B7A" opacity="0.85" rx="1"/>
  <text x="345.0" y="292" class="num">14.1% (92% cum)</text>
  <text x="112" y="319" class="lbl" text-anchor="end">1-10 min</text>
  <rect x="122" y="305" width="87.8" height="20" fill="#2E8B7A" opacity="0.85" rx="1"/>
  <text x="217.8" y="319" class="num">5.7% (98% cum)</text>
  <text x="112" y="346" class="lbl" text-anchor="end">&gt; 10 min</text>
  <rect x="122" y="332" width="34.2" height="20" fill="#2E8B7A" opacity="0.85" rx="1"/>
  <text x="164.2" y="346" class="num">2.2% (100% cum)</text>
  <text x="0" y="381" class="sub">Orange: 19% of all orders are gone within 10 milliseconds. The median is 1.2 seconds.</text>
</svg>
