name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DPRICETIME_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # Keeps the bench binary from bitrotting; numbers from shared CI runners
      # are meaningless and are never published. The perf property that IS
      # enforced in CI is deterministic: see the allocation tests.
      - name: Bench smoke
        if: runner.os == 'Linux' && matrix.config == 'Release'
        run: ./build/bench/pricetime_bench --ops 2000 --core -1

      # End-to-end: generate a synthetic ITCH file, rebuild books from it, and
      # run the strategy sandbox over it. replay_itch exits non-zero if the
      # parse fails or any reconstructed book is crossed, so this is a real
      # assertion about the whole pipeline, not just a smoke test.
      - name: Pipeline end-to-end
        if: runner.os == 'Linux' && matrix.config == 'Release'
        run: |
          ./build/tools/gen_itch /tmp/ci.itch --messages 200000
          ./build/tools/replay_itch /tmp/ci.itch --depth 3
          ./build/tools/mm_sandbox /tmp/ci.itch --symbol AAPL --half-spread 1

  sanitizers:
    name: ubuntu / asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPRICETIME_SANITIZE=ON -DPRICETIME_WERROR=ON -DPRICETIME_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1

  thread-sanitizer:
    name: ubuntu / tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SPSC queue between the network and matching threads is the only
      # lock-free code in the repo. Its memory ordering cannot be validated by
      # a single-threaded test, so it gets its own sanitizer build. Relaxing
      # the release/acquire pairing makes this job fail, which is how we know
      # the check has teeth.
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPRICETIME_TSAN=ON -DPRICETIME_WERROR=ON -DPRICETIME_BUILD_BENCH=OFF
          -DPRICETIME_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
